# Captured from $HOME/Local/restim/restim.ini on 2026-08-20 (restim ~v1.62 config)

[device]
transport = "serial"        # "serial" | "tcp"
serial_port = "COM13"
serial_baud = 115200
tcp_host = "192.168.1.50"
tcp_port = 55533
firmware_pinned = "1.3.2"
start_imu = false            # IMU stream off by default (PlaStim 2026-08-20): 103 msg/s, floods the WiFi bridge

[signal]
mode = "threephase"         # "threephase" | "fourphase"
waveform_amplitude_amps = 0.15   # hard cap; board max 0.2
min_carrier_hz = 500
max_carrier_hz = 2000

[carrier_defaults]
pulse_width = 11.5
pulse_carrier_frequency = 790
pulse_frequency = 74

[calibration.threephase]    # restim hw_calibration (dB)
center = -0.3
neutral = -2.1
right = 0.3

[calibration.fourphase]     # restim v1.66 schema is a/b/c/d + center_reduction; the tester's old ini had center/a/b/c (stale) -> REDO in v1.66 (TP-0b)
a = 0.3
b = 1.1
c = -0.3
d = 0.0
center_reduction = 0.07

[safety]
master_volume_default = 0.0
slow_start_s = 4
deadman_silence_s = 2.0
deadman_ramp_down_s = 3.0
inactivity_decay = true

[tcode]
websocket_port = 12346
udp_port = 12347
tcp_port = 12347

# T-code axis map (restim's ports + the tester's restim.ini ranges). T-code 0..1 maps linearly onto [min,max].
# Targets: alpha beta gamma api_volume carrier pulse_frequency pulse_width pulse_interval_random
#          pulse_rise_time e1 e2 e3 e4. Add/override entries here; unknown codes are ignored.
[tcode.axes]
L0 = { target = "alpha", min = -1.0, max = 1.0 }
L1 = { target = "beta", min = -1.0, max = 1.0 }
L2 = { target = "gamma", min = -1.0, max = 1.0 }
V0 = { target = "api_volume", min = 0.0, max = 1.0 }
C0 = { target = "carrier", min = 500.0, max = 2000.0 }
P0 = { target = "pulse_frequency", min = 0.0, max = 150.0 }
P1 = { target = "pulse_width", min = 4.0, max = 10.0 }
P2 = { target = "pulse_interval_random", min = 0.0, max = 1.0 }
P3 = { target = "pulse_rise_time", min = 2.0, max = 20.0 }
E1 = { target = "e1", min = 0.0, max = 1.0 }
E2 = { target = "e2", min = 0.0, max = 1.0 }
E3 = { target = "e3", min = 0.0, max = 1.0 }
E4 = { target = "e4", min = 0.0, max = 1.0 }

[api]
http_port = 8321

[foc312]            # the ET-312 emulator app (foc312/), served by the engine process on its own port
port = 8322
enabled = true
# .elk folder and monophasic shape come from [et312] (optional): elk_dir (your own .elk files; none by default),
# monophasic_asymmetry (1..4, default 3: return-phase width / lead width for the 312's monophasic pulses)

[content]
in_process = false  # worker processes, pre-warmed off-loop at start (2026-08-20)

[et312]
elk_dir = ""        # your own .elk folder (optional)
